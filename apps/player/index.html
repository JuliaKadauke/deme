<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Host shell: runs no game code. Its only jobs are embedding play.html
      (where the game, and the sandboxed Lua/wasmoon VM, actually run)
      inside an iframe sandboxed with just `allow-scripts`, and forwarding
      this page's query string (e.g. `?debug`) onto that iframe's src via
      src/host.ts — the one script its CSP allows. Deliberately omitting
      `allow-same-origin` on the iframe is what makes the isolation real: it
      puts play.html's content in a unique opaque origin, so even a full
      VM-sandbox escape inside it has no origin to read this page's DOM,
      cookies, or localStorage from, or to reach another game's saved data
      through. See docs/architecture.md#scripting and README.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="/src/host.css" />
    <title>deme</title>
  </head>
  <body>
    <iframe src="/play.html" sandbox="allow-scripts" title="deme"></iframe>
    <script type="module" src="/src/host.ts"></script>
  </body>
</html>
