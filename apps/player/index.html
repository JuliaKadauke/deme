<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Host shell: intentionally inert. It runs no game code and has no
      script-src at all — its only job is to embed play.html (where the
      game, and the sandboxed Lua/wasmoon VM, actually run) inside an
      iframe sandboxed with just `allow-scripts`. Deliberately omitting
      `allow-same-origin` is what makes this isolation real: it puts
      play.html's content in a unique opaque origin, so even a full
      VM-sandbox escape inside it has no origin to read this page's DOM,
      cookies, or localStorage from, or to reach another game's saved data
      through. See docs/architecture.md#scripting and README.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="/src/host.css" />
    <title>deme</title>
  </head>
  <body>
    <iframe src="/play.html" sandbox="allow-scripts" title="deme"></iframe>
  </body>
</html>
